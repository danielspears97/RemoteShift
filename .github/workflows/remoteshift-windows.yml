name: RemoteShift Windows build

# Builds RemoteShift for Windows x64, runs the input-engine tests, and produces:
#   - RemoteShift-<version>-win64-setup.exe     (Inno Setup installer, no admin rights needed)
#   - RemoteShift-<version>-win64-portable.zip  (unzip and run; data stays next to the exe)
# Pushing a tag like v0.1.0 also publishes both files as a GitHub Release, which the
# in-app update checker reads.

on:
  push:
    branches: [ main, remoteshift ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      CC: clang-cl.exe
      CXX: clang-cl.exe
      VULKAN_SDK: C:\VulkanSDK\
      triplet: x64-windows
      vcpkg_baseline: 42bb0d9e8d4cf33485afb9ee2229150f79f61a1f
      dep_folder: deps
      libplacebo_tag: v7.387.0
      sdl2_compat_tag: 2.32.74

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Read RemoteShift version
        run: |
          $v = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(REMOTESHIFT_VERSION ([0-9.]+)\)').Matches.Groups[1].Value
          if (-not $v) { throw "REMOTESHIFT_VERSION not found in CMakeLists.txt" }
          echo "RS_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}\build\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Vulkan
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ver = (Invoke-WebRequest -UseBasicParsing -Uri "https://vulkan.lunarg.com/sdk/latest.json" | ConvertFrom-Json).windows
          echo "Vulkan SDK $ver"
          Invoke-WebRequest -UseBasicParsing -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile VulkanSDK.exe
          .\VulkanSDK.exe --root ${{ env.VULKAN_SDK }} --accept-licenses --default-answer --confirm-command install

      - name: Set up Ninja
        run: choco install ninja

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: 18

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          arch: "win64_msvc2022_64"
          host: 'windows'
          target: 'desktop'
          modules: 'qtwebengine qtpositioning qtwebchannel qtwebsockets qtserialport'

      - name: Install pip dependencies
        run: |
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade pip setuptools wheel
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade scons protobuf grpcio-tools pyinstaller meson

      - name: Setup ffmpeg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip" -OutFile ".\ffmpeg.zip"
          Expand-Archive -LiteralPath "ffmpeg.zip" -DestinationPath "."
          Rename-Item "ffmpeg-n9.0-latest-win64-gpl-shared-9.0" "${{ env.dep_folder }}"

      - name: Setup sdl2-compat
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/libsdl-org/sdl2-compat/releases/download/release-${{ env.sdl2_compat_tag }}/sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip -OutFile sdl2-compat.zip
          Expand-Archive -Force -LiteralPath "sdl2-compat.zip" -DestinationPath ".\sdl2-compat"
          Get-ChildItem -Path ".\sdl2-compat\*" -Include "*.dll" | Copy-Item -Force -Destination "${{ env.dep_folder }}\bin"

      - name: Build SPIRV-Cross
        run: |
          git clone https://github.com/KhronosGroup/SPIRV-Cross.git
          cd SPIRV-Cross
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\${{ env.dep_folder }}" -DSPIRV_CROSS_SHARED=ON -S . -B build -G Ninja
          cmake --build build --config Release
          cmake --install build

      - name: Setup shaderc
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = ((Invoke-WebRequest -UseBasicParsing -Uri "https://storage.googleapis.com/shaderc/badges/build_link_windows_vs2019_release.html").Content | Select-String -Pattern 'url=(.*)"').Matches.Groups[1].Value
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile .\shaderc.zip
          Expand-Archive -LiteralPath "shaderc.zip" -DestinationPath "."
          cp "./install/*" "./${{ env.dep_folder }}" -Force -Recurse
          rm "./install" -r -force

      - name: Make build directory
        run: mkdir build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.vcpkg_baseline }}
          runVcpkgInstall: true
          vcpkgJsonGlob: "vcpkg.json"

      - name: Build libplacebo
        run: |
          git clone --recursive https://github.com/haasn/libplacebo.git
          cd libplacebo
          git checkout --recurse-submodules ${{ env.libplacebo_tag }}
          meson setup `
          --prefix "${{ github.workspace }}\${{ env.dep_folder }}" `
          --native-file ../meson.ini `
          "--pkg-config-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\lib\pkgconfig','${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\share\pkgconfig','${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig']" `
          "--cmake-prefix-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}', '${{ env.VULKAN_SDK }}', '${{ github.workspace }}\${{ env.dep_folder }}']" `
          -Dc_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dcpp_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dc_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Dcpp_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Ddemos=false `
          ./build
          ninja -C./build
          ninja -C./build install

      - name: Apply patches
        run: git apply --ignore-whitespace --verbose --directory=third-party/gf-complete/ scripts/windows-vc/gf-complete.patch

      - name: Configure RemoteShift
        run: |
          cmake `
          -S . `
          -B build `
          -G Ninja `
          -DCMAKE_TOOLCHAIN_FILE:STRING="vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCHIAKI_ENABLE_CLI=OFF `
          -DCHIAKI_ENABLE_TESTS=ON `
          -DCHIAKI_GUI_ENABLE_SDL_GAMECONTROLLER=ON `
          -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF `
          -DREMOTESHIFT_UPDATE_REPO="${{ github.repository }}" `
          -DPYTHON_EXECUTABLE="${{ env.pythonLocation }}\python.exe" `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}\${{ env.dep_folder }};${{ env.VULKAN_SDK }}"

      - name: Build RemoteShift and tests
        run: cmake --build build --config Release --target chiaki rsinput_tests rsinputcontroller_test

      - name: Run input engine tests
        run: |
          $env:PATH = "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin;${{ github.workspace }}\${{ env.dep_folder }}\bin;$env:PATH"
          ctest --test-dir build -R "rsinput" --output-on-failure

      - name: Assemble application folder
        run: |
          mkdir RemoteShift-Win
          cp build\gui\RemoteShift.exe RemoteShift-Win
          cp build\third-party\cpp-steam-tools\cpp-steam-tools.dll RemoteShift-Win
          cp scripts\qtwebengine_import.qml gui\src\qml\
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libcrypto-*-x64.dll" RemoteShift-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libssl-*-x64.dll" RemoteShift-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL2.dll" RemoteShift-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL3.dll" RemoteShift-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\hidapi.dll" RemoteShift-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\fftw3.dll" RemoteShift-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\opus.dll" RemoteShift-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libspeexdsp.dll" RemoteShift-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\lcms2.dll" RemoteShift-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\miniupnpc.dll" RemoteShift-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\json-c.dll" RemoteShift-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\swresample-*.dll" RemoteShift-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avcodec-*.dll" RemoteShift-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avutil-*.dll" RemoteShift-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avformat-*.dll" RemoteShift-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\libplacebo-*.dll" RemoteShift-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\shaderc_shared.dll" RemoteShift-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\spirv-cross-c-shared.dll" RemoteShift-Win
          windeployqt.exe --no-translations --qmldir=gui\src\qml --release RemoteShift-Win\RemoteShift.exe
          mkdir RemoteShift-Win\licenses
          cp LICENSES\* RemoteShift-Win\licenses
          cp COPYING RemoteShift-Win\licenses\COPYING.txt
          cp rsinput\third_party\nlohmann\LICENSE.MIT RemoteShift-Win\licenses\nlohmann-json-MIT.txt
          cp README.md RemoteShift-Win\README.md
          cp NOTICE.md RemoteShift-Win\NOTICE.md

      - name: Smoke-test the packaged app starts
        # Hosted runners have no GPU; a failure here is reported but does not block the artifacts.
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath RemoteShift-Win\RemoteShift.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "RemoteShift.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Portable zip
        run: |
          Copy-Item -Recurse RemoteShift-Win RemoteShift-Portable
          Set-Content -Path RemoteShift-Portable\portable.txt -Value "RemoteShift portable mode: settings, console registrations and input profiles are stored in the 'data' folder next to RemoteShift.exe. Delete this file to use your user profile instead."
          Compress-Archive -Path RemoteShift-Portable\* -DestinationPath "RemoteShift-$env:RS_VERSION-win64-portable.zip"

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: "scripts/remoteshift.iss"
          options: /O+ /DMyAppVersion=${{ env.RS_VERSION }}

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: RemoteShift-${{ env.RS_VERSION }}-win64-portable
          path: RemoteShift-${{ env.RS_VERSION }}-win64-portable.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: RemoteShift-${{ env.RS_VERSION }}-win64-setup
          path: RemoteShift-${{ env.RS_VERSION }}-win64-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteShift ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            RemoteShift-${{ env.RS_VERSION }}-win64-setup.exe
            RemoteShift-${{ env.RS_VERSION }}-win64-portable.zip
