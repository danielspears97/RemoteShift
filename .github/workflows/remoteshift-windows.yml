name: RemoteShift Windows build

# Builds RemoteShift for Windows x64 with MSYS2 (the same toolchain upstream chiaki-ng ships its
# Windows releases with), runs the input-engine tests, and produces:
#   - RemoteShift-<version>-win64-setup.exe     (Inno Setup installer, no admin rights needed)
#   - RemoteShift-<version>-win64-portable.zip  (unzip and run; data stays next to the exe)
# Pushing a tag like v0.1.0 also publishes both files as a GitHub Release, which the in-app
# update checker reads.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      sdl2_compat_tag: 2.32.74
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            compiler-rt:p

      - name: Read RemoteShift version
        run: |
          v="$(grep -Eo 'set\(REMOTESHIFT_VERSION [0-9.]+\)' CMakeLists.txt | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')"
          test -n "$v" || { echo "REMOTESHIFT_VERSION not found"; exit 1; }
          echo "RS_VERSION=$v" >> "$GITHUB_ENV"
          echo "RemoteShift $v"

      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Build libplacebo
        run: scripts/build-libplacebo-windows.sh

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          unzip -q ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/bin/." /mingw64/bin
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/include/." /mingw64/include
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/lib/." /mingw64/lib

      - name: Build sdl2-compat
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          INSTALL_PREFIX=/mingw64 scripts/build-hidapi.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Configure RemoteShift
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF \
            -DCHIAKI_ENABLE_TESTS=ON -DREMOTESHIFT_UPDATE_REPO="${{ github.repository }}"

      - name: Build RemoteShift and tests
        run: cmake --build build --config Release --target chiaki rsinput_tests rsinputcontroller_test

      - name: Run input engine tests
        run: ctest --test-dir build -R rsinput --output-on-failure

      - name: Assemble application folder
        run: |
          ./scripts/deploy-windows-msys2.sh RemoteShift-Win build/gui/RemoteShift.exe "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml
          mkdir -p RemoteShift-Win/licenses
          cp LICENSES/* RemoteShift-Win/licenses/
          cp COPYING RemoteShift-Win/licenses/COPYING.txt
          cp rsinput/third_party/nlohmann/LICENSE.MIT RemoteShift-Win/licenses/nlohmann-json-MIT.txt
          cp README.md NOTICE.md RemoteShift-Win/

      - name: Smoke-test the packaged app starts
        # Runs a copy of the package with Mesa's software OpenGL beside it, because hosted
        # runners have no GPU. The shipped folder is not touched.
        run: |
          pacman -S --noconfirm mingw-w64-x86_64-mesa || true
          cp -r RemoteShift-Win RemoteShift-Smoke
          for f in opengl32.dll libgallium_wgl.dll libglapi.dll vulkan_lvp.dll; do
            [ -f "/mingw64/bin/$f" ] && cp "/mingw64/bin/$f" RemoteShift-Smoke/ && echo "staged $f"
          done
          ls /mingw64/share/vulkan/icd.d 2>/dev/null || true

      - name: Smoke-test run
        # Informational: hosted runners have no GPU, so this depends on Mesa's software drivers.
        # The log line "SMOKE RESULT" and the uploaded screenshot say what actually happened.
        continue-on-error: true
        shell: pwsh
        run: |
          # Mesa's drivers need LLVM and friends from the MSYS2 prefix (test run only).
          $env:PATH = "D:\a\_temp\msys64\mingw64\bin;" + $env:PATH
          Copy-Item RemoteShift-Smoke\opengl32.dll RemoteShift-Smoke\opengl32sw.dll -ErrorAction SilentlyContinue
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $env:QT_LOGGING_RULES = "*.debug=false"
          $icd = Get-ChildItem "D:\a\_temp\msys64\mingw64\share\vulkan\icd.d\lvp_icd*.json" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($icd) { $env:VK_DRIVER_FILES = $icd.FullName; echo "Using Vulkan driver $($icd.FullName)" }
          $p = Start-Process -FilePath RemoteShift-Smoke\RemoteShift.exe -PassThru -RedirectStandardError smoke-err.txt -RedirectStandardOutput smoke-out.txt
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke-screenshot.png")
          $exited = $p.HasExited
          if (-not $exited) { Stop-Process -Id $p.Id -Force }
          echo "---- stderr ----"; Get-Content smoke-err.txt -ErrorAction SilentlyContinue | Select-Object -Last 60
          if ($exited) { echo "SMOKE RESULT: FAILED, exited early with code 0x$('{0:X8}' -f $p.ExitCode)"; exit 1 }
          echo "SMOKE RESULT: OK, RemoteShift.exe was still running after 20 s"

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test
          path: |
            smoke-screenshot.png
            smoke-err.txt
          if-no-files-found: warn

      - name: Portable zip
        run: |
          cp -r RemoteShift-Win RemoteShift-Portable
          printf '%s\r\n' "RemoteShift portable mode: settings, console registrations and input profiles are stored in the 'data' folder next to RemoteShift.exe. Delete this file to use your user profile instead." > RemoteShift-Portable/portable.txt
          (cd RemoteShift-Portable && zip -qr "../RemoteShift-${RS_VERSION}-win64-portable.zip" .)

      - name: Stamp installer version
        run: sed -i "s/#define MyAppVersion \"0.0.0\"/#define MyAppVersion \"${RS_VERSION}\"/" scripts/remoteshift.iss && grep -n 'define MyAppVersion' scripts/remoteshift.iss

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: "scripts/remoteshift.iss"
          options: /O+

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: RemoteShift-${{ env.RS_VERSION }}-win64-portable
          path: RemoteShift-${{ env.RS_VERSION }}-win64-portable.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: RemoteShift-${{ env.RS_VERSION }}-win64-setup
          path: RemoteShift-${{ env.RS_VERSION }}-win64-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteShift ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            RemoteShift-${{ env.RS_VERSION }}-win64-setup.exe
            RemoteShift-${{ env.RS_VERSION }}-win64-portable.zip
